point:
  role: platform
  enabled: true
  aliases: []
  description: Value at the selected period, optional calendar offset.
  example: |
    previous_year_value:
      op: point
      of: sotif_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.combo
  attr: Point

window:
  role: platform
  enabled: true
  aliases: []
  description: Trailing, leading, period-to-date, or full-period aggregate of a base measure.
  example: |
    value_qtd:
      op: window
      of: sotif_value
      range: qtd
  module: kpi_engine.capabilities.ops.combo
  attr: Window

trend:
  role: platform
  enabled: true
  aliases: []
  description: Fixed-length period array plus a shared axis for graphs.
  example: |
    trend_12m:
      op: trend
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.ops.combo
  attr: Trend

arithmetic:
  role: platform
  enabled: true
  aliases: []
  description: Combine other measures with a registered measure function (default divide).
  example: |
    ratio:
      op: arithmetic
      of: [current_value, previous_year_value]
      fn: divide
  module: kpi_engine.capabilities.ops.combo
  attr: Arithmetic

fn:
  role: platform
  enabled: true
  aliases: []
  description: Feed other measures' scalars into a named measure function.
  example: |
    yoy:
      op: fn
      fn: growth_pct
      inputs: [current_value, previous_year_value]
  module: kpi_engine.capabilities.ops.combo
  attr: Fn

expr:
  role: platform
  enabled: true
  aliases: []
  description: Formula over other measures using + - * /.
  example: |
    blended:
      op: expr
      expr: (current_value + previous_year_value) / 2
  module: kpi_engine.capabilities.ops.combo
  attr: Expr

constant:
  role: platform
  enabled: true
  aliases: []
  description: A literal number on every row.
  example: |
    target:
      op: constant
      value: 95
  module: kpi_engine.capabilities.ops.combo
  attr: Constant

dimension:
  role: platform
  enabled: true
  aliases: []
  description: Echo a grouping field as a requestable measure key.
  example: |
    region:
      op: dimension
  module: kpi_engine.capabilities.ops.combo
  attr: Dimension

hook:
  role: platform
  enabled: true
  aliases: []
  description: Call an allowlisted Python hook for logic the catalog cannot express.
  example: |
    custom:
      op: hook
      hook: seasonal_index
      of: sotif_value
  module: kpi_engine.capabilities.ops.combo
  attr: Hook

rank:
  role: platform
  enabled: true
  aliases: []
  description: Rank groups on a cut. Ties share a rank; the next rank skips.
  example: |
    reason_rank:
      op: rank
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: Rank

percent_of_total:
  role: platform
  enabled: true
  aliases: []
  description: Share of all groups on this cut (source * 100 / partition sum).
  example: |
    share:
      op: percent_of_total
      of: current_value
      partition_by: [region]
  module: kpi_engine.capabilities.ops.cut
  attr: PercentOfTotal

ntile:
  role: addon
  enabled: true
  aliases: []
  description: Bucket groups into N tiles using RANK-style ties.
  example: |
    value_quartile:
      op: ntile
      of: current_value
      tiles: 4
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: Ntile

dense_rank:
  role: addon
  enabled: true
  aliases: []
  description: Rank groups on a cut. Ties share a rank; the next rank does not skip.
  example: |
    reason_dense_rank:
      op: dense_rank
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: DenseRank

row_number:
  role: addon
  enabled: true
  aliases: []
  description: Unique 1..n order on a cut. Nulls sort last.
  example: |
    reason_row:
      op: row_number
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: RowNumber

cumulative_share:
  role: addon
  enabled: true
  aliases: []
  description: Running share of of (Pareto). Last row in desc order is 100.
  example: |
    pareto:
      op: cumulative_share
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: CumulativeShare

running_total:
  role: addon
  enabled: true
  aliases: []
  description: Ordered running sum of of on the cut.
  example: |
    running:
      op: running_total
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: RunningTotal

contribution:
  role: addon
  enabled: true
  aliases: []
  description: Share of the cut's (of - vs) change. Who drove the movement.
  example: |
    yoy_contrib:
      op: contribution
      of: current_value
      vs: previous_year_value
  module: kpi_engine.capabilities.ops.cut
  attr: Contribution

lag:
  role: addon
  enabled: true
  aliases: []
  description: Value of a base, point, or window measure at offset before the anchor.
  example: |
    value_3m_ly:
      op: lag
      of: value_3m
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: Lag

lead:
  role: addon
  enabled: true
  aliases: []
  description: Value of a base, point, or window measure at offset after the anchor.
  example: |
    next_month:
      op: lead
      of: current_value
      offset: { months: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: Lead

index:
  role: addon
  enabled: true
  aliases: []
  description: of / lagged of × 100. 100 means unchanged vs the offset period.
  example: |
    volume_index:
      op: index
      of: current_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: Index

vs_target:
  role: addon
  enabled: true
  aliases: []
  description: Compare of to a target measure or literal (gap or percent).
  example: |
    gap:
      op: vs_target
      of: current_value
      vs: target
      as: gap
  module: kpi_engine.capabilities.ops.period
  attr: VsTarget

threshold:
  role: addon
  enabled: true
  aliases: []
  description: 1 if of meets cmp vs a literal or measure, else 0.
  example: |
    hit_sla:
      op: threshold
      of: current_value
      cmp: gte
      value: 95
  module: kpi_engine.capabilities.ops.period
  attr: Threshold

percent_rank:
  role: addon
  enabled: true
  aliases: []
  description: RANK-style percent rank on a cut, scaled 0-100. One group is 0.
  example: |
    reason_pct_rank:
      op: percent_rank
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: PercentRank

gap_to_leader:
  role: addon
  enabled: true
  aliases: []
  description: of minus the partition max. The leader is 0.
  example: |
    vs_best:
      op: gap_to_leader
      of: current_value
  module: kpi_engine.capabilities.ops.cut
  attr: GapToLeader

gap_to_avg:
  role: addon
  enabled: true
  aliases: []
  description: of minus the partition mean.
  example: |
    vs_typical:
      op: gap_to_avg
      of: current_value
  module: kpi_engine.capabilities.ops.cut
  attr: GapToAvg

zscore:
  role: addon
  enabled: true
  aliases: []
  description: (of - mean) / sample stdev on the partition. Zero stdev is 0.
  example: |
    reason_z:
      op: zscore
      of: current_value
  module: kpi_engine.capabilities.ops.cut
  attr: ZScore

running_avg:
  role: addon
  enabled: true
  aliases: []
  description: Ordered running mean of of on the cut.
  example: |
    running_mean:
      op: running_avg
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: RunningAvg

top_n:
  role: addon
  enabled: true
  aliases: []
  description: 1 if RANK() is <= n, else 0. Ties can produce more than n ones.
  example: |
    top_reason:
      op: top_n
      of: current_value
      n: 3
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: TopN

diff:
  role: addon
  enabled: true
  aliases: []
  description: of minus the same measure at offset before the anchor.
  example: |
    vs_last_year:
      op: diff
      of: current_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: Diff

pct_change:
  role: addon
  enabled: true
  aliases: []
  description: growth_pct(of, lagged of) at offset. Same scale as fn growth_pct.
  example: |
    yoy:
      op: pct_change
      of: current_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: PctChange
