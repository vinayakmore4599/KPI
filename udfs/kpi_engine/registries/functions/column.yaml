value:
  role: platform
  enabled: true
  aliases: [identity]
  description: Pass one retrieved column through unchanged.
  example: |
    amount:
      columns: [amount]
      op: value
  module: kpi_engine.capabilities.functions.column.impl
  attr: value

abs:
  role: platform
  enabled: true
  aliases: []
  description: Absolute value of one numeric column.
  example: |
    abs_delta:
      columns: [delta]
      op: abs
  module: kpi_engine.capabilities.functions.column.impl
  attr: abs_columns

sum:
  role: platform
  enabled: true
  aliases: [add]
  min_args: 2
  description: Row-wise sum of two or more columns.
  example: |
    total:
      columns: [a, b]
      op: sum
  module: kpi_engine.capabilities.functions.column.impl
  attr: sum_columns

subtract:
  role: platform
  enabled: true
  aliases: [sub]
  min_args: 2
  description: Row-wise left-to-right subtraction.
  example: |
    net:
      columns: [gross, returns]
      op: subtract
  module: kpi_engine.capabilities.functions.column.impl
  attr: subtract_columns

multiply:
  role: platform
  enabled: true
  aliases: [mul, product]
  min_args: 2
  description: Row-wise product of two or more columns.
  example: |
    ontime_full:
      columns: [ontime, fullqty]
      op: multiply
  module: kpi_engine.capabilities.functions.column.impl
  attr: multiply_columns

divide:
  role: platform
  enabled: true
  aliases: [div, ratio]
  description: Row-wise numerator / denominator. Zero denominator is null.
  example: |
    rate:
      columns: [shipped, ordered]
      op: divide
  module: kpi_engine.capabilities.functions.column.impl
  attr: divide_columns

percent_of:
  role: platform
  enabled: true
  aliases: [share]
  description: Row-wise share of whole, scaled to 0-100.
  example: |
    fill_pct:
      columns: [filled, ordered]
      op: percent_of
  module: kpi_engine.capabilities.functions.column.impl
  attr: percent_of_columns

min:
  role: platform
  enabled: true
  aliases: []
  min_args: 2
  description: Row-wise minimum of two or more columns.
  example: |
    lower:
      columns: [a, b]
      op: min
  module: kpi_engine.capabilities.functions.column.impl
  attr: min_columns

max:
  role: platform
  enabled: true
  aliases: []
  min_args: 2
  description: Row-wise maximum of two or more columns.
  example: |
    upper:
      columns: [a, b]
      op: max
  module: kpi_engine.capabilities.functions.column.impl
  attr: max_columns

avg:
  role: platform
  enabled: true
  aliases: [mean]
  min_args: 2
  description: Row-wise mean of two or more columns.
  example: |
    mid:
      columns: [a, b]
      op: avg
  module: kpi_engine.capabilities.functions.column.impl
  attr: avg_columns

coalesce:
  role: platform
  enabled: true
  aliases: []
  min_args: 2
  description: First non-null value on each row.
  example: |
    picked:
      columns: [preferred, fallback]
      op: coalesce
  module: kpi_engine.capabilities.functions.column.impl
  attr: coalesce_columns

if_null:
  role: addon
  enabled: true
  aliases: []
  description: Value when present, otherwise the fallback column.
  example: |
    qty:
      columns: { value: ordered_qty, fallback: planned_qty }
      op: if_null
  module: kpi_engine.capabilities.functions.column.impl
  attr: if_null_columns

nullif:
  role: addon
  enabled: true
  aliases: []
  description: Null where value equals the sentinel column.
  example: |
    nonzero:
      columns: { value: amount, sentinel: offset_col }
      op: nullif
  module: kpi_engine.capabilities.functions.column.impl
  attr: nullif_columns

null_if_zero:
  role: addon
  enabled: true
  aliases: []
  description: Null where the column is 0.
  example: |
    rate:
      columns: [amount]
      op: null_if_zero
  module: kpi_engine.capabilities.functions.column.impl
  attr: null_if_zero_columns

zero_if_null:
  role: addon
  enabled: true
  aliases: []
  description: 0 where the column is null.
  example: |
    qty_or_zero:
      columns: [ordered_qty]
      op: zero_if_null
  module: kpi_engine.capabilities.functions.column.impl
  attr: zero_if_null_columns

is_null:
  role: addon
  enabled: true
  aliases: []
  description: 1 where the column is null, else 0.
  example: |
    missing:
      columns: [amount]
      op: is_null
  module: kpi_engine.capabilities.functions.column.impl
  attr: is_null_columns

is_not_null:
  role: addon
  enabled: true
  aliases: []
  description: 1 where the column is present, else 0.
  example: |
    present:
      columns: [amount]
      op: is_not_null
  module: kpi_engine.capabilities.functions.column.impl
  attr: is_not_null_columns

if_else:
  role: addon
  enabled: true
  aliases: []
  description: Then-column where cond is nonzero, otherwise other.
  example: |
    picked:
      columns: { cond: flag, then: amount, other: fallback }
      op: if_else
  module: kpi_engine.capabilities.functions.column.impl
  attr: if_else_columns
