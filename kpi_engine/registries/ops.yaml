point:
  role: platform
  enabled: true
  aliases: []
  description: Value over the time selection (one bucket or many), optional calendar offset.
  example: |
    previous_year_value:
      op: point
      of: sotif_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.combo
  attr: Point

window:
  role: platform
  enabled: true
  aliases: []
  description: Trailing, leading, period-to-date, or full-period aggregate of a base measure.
  example: |
    value_qtd:
      op: window
      of: sotif_value
      range: qtd
  module: kpi_engine.capabilities.ops.combo
  attr: Window

trend:
  role: platform
  enabled: true
  aliases: []
  description: Fixed-length period array plus a shared axis for graphs.
  example: |
    trend_12m:
      op: trend
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.ops.combo
  attr: Trend

trend_arithmetic:
  role: platform
  enabled: true
  aliases: []
  description: >
    Per-period fn or expr over base totals or aligned trend series
    (ratio-of-totals, not a trend of a composite scalar).
  example: |
    sotif_pct_trend:
      op: trend_arithmetic
      of: [total_po, supplier_driven_po]
      expr: (total_po - supplier_driven_po) / total_po
      trailing: { months: 12 }
      cuts: [G]
  module: kpi_engine.capabilities.ops.combo
  attr: TrendArithmetic

arithmetic:
  role: platform
  enabled: true
  aliases: []
  description: Combine other measures with a registered measure function (default divide).
  example: |
    ratio:
      op: arithmetic
      of: [current_value, previous_year_value]
      fn: divide
  module: kpi_engine.capabilities.ops.combo
  attr: Arithmetic

fn:
  role: platform
  enabled: true
  aliases: []
  description: Feed other measures' scalars into a named measure function.
  example: |
    yoy:
      op: fn
      fn: growth_pct
      inputs: [current_value, previous_year_value]
  module: kpi_engine.capabilities.ops.combo
  attr: Fn

expr:
  role: platform
  enabled: true
  aliases: []
  description: Formula over other measures using + - * /.
  example: |
    blended:
      op: expr
      expr: (current_value + previous_year_value) / 2
  module: kpi_engine.capabilities.ops.combo
  attr: Expr

constant:
  role: platform
  enabled: true
  aliases: []
  description: A literal number, or a per-dimension map with default.
  example: |
    region_target:
      op: constant
      by: region
      value: { APAC: 90, EMEA: 85 }
      default: null
  module: kpi_engine.capabilities.ops.combo
  attr: Constant

dimension:
  role: platform
  enabled: true
  aliases: []
  description: Echo a grouping field as a requestable measure key.
  example: |
    region:
      op: dimension
  module: kpi_engine.capabilities.ops.combo
  attr: Dimension

predicate:
  role: platform
  enabled: true
  aliases: []
  description: 1/0 flag when all (or any) measure predicates pass. Does not drop rows.
  example: |
    healthy:
      op: predicate
      match: all
      predicates:
        - { of: total_profit, cmp: gt, value: 0 }
        - { of: return_rate, cmp: lt, value: 0.20 }
  module: kpi_engine.capabilities.ops.combo
  attr: Predicate

hook:
  role: platform
  enabled: true
  aliases: []
  description: Call an allowlisted Python hook for logic the catalog cannot express.
  example: |
    custom:
      op: hook
      hook: seasonal_index
      of: sotif_value
  module: kpi_engine.capabilities.ops.combo
  attr: Hook

rank:
  role: platform
  enabled: true
  aliases: []
  description: Rank groups on a cut. Ties share a rank; the next rank skips.
  example: |
    reason_rank:
      op: rank
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: Rank

percent_of_total:
  role: platform
  enabled: true
  aliases: []
  description: Share of all groups on this cut (source * 100 / partition sum).
  example: |
    share:
      op: percent_of_total
      of: current_value
      partition_by: [region]
  module: kpi_engine.capabilities.ops.cut
  attr: PercentOfTotal

ntile:
  role: addon
  enabled: true
  aliases: []
  description: Bucket groups into N tiles using RANK-style ties.
  example: |
    value_quartile:
      op: ntile
      of: current_value
      tiles: 4
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: Ntile

dense_rank:
  role: addon
  enabled: true
  aliases: []
  description: Rank groups on a cut. Ties share a rank; the next rank does not skip.
  example: |
    reason_dense_rank:
      op: dense_rank
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: DenseRank

row_number:
  role: addon
  enabled: true
  aliases: []
  description: Unique 1..n order on a cut. Nulls sort last.
  example: |
    reason_row:
      op: row_number
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: RowNumber

cumulative_share:
  role: addon
  enabled: true
  aliases: []
  description: Running share of of (Pareto). Last row in desc order is 100.
  example: |
    pareto:
      op: cumulative_share
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: CumulativeShare

running_total:
  role: addon
  enabled: true
  aliases: []
  description: Ordered running sum of of on the cut.
  example: |
    running:
      op: running_total
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: RunningTotal

contribution:
  role: addon
  enabled: true
  aliases: []
  description: Share of the cut's (of - vs) change. Who drove the movement.
  example: |
    yoy_contrib:
      op: contribution
      of: current_value
      vs: previous_year_value
  module: kpi_engine.capabilities.ops.cut
  attr: Contribution

lag:
  role: addon
  enabled: true
  aliases: []
  description: Value of a base or shiftable measure over the selection shifted by offset.
  example: |
    value_3m_ly:
      op: lag
      of: value_3m
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: Lag

lead:
  role: addon
  enabled: true
  aliases: []
  description: Value of a base or shiftable measure over the selection shifted forward by offset.
  example: |
    next_month:
      op: lead
      of: current_value
      offset: { months: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: Lead

index:
  role: addon
  enabled: true
  aliases: []
  description: of / lagged of × 100 over the selection vs the shifted selection. Source is a base or shiftable measure. 100 means unchanged.
  example: |
    volume_index:
      op: index
      of: current_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: Index

vs_target:
  role: addon
  enabled: true
  aliases: []
  description: Compare of to a target measure or literal (gap or percent).
  example: |
    gap:
      op: vs_target
      of: current_value
      vs: target
      as: gap
  module: kpi_engine.capabilities.ops.period
  attr: VsTarget

threshold:
  role: addon
  enabled: true
  aliases: []
  description: 1 if of meets cmp vs a literal or measure, else 0.
  example: |
    hit_sla:
      op: threshold
      of: current_value
      cmp: gte
      value: 95
  module: kpi_engine.capabilities.ops.period
  attr: Threshold

percent_rank:
  role: addon
  enabled: true
  aliases: []
  description: RANK-style percent rank on a cut, scaled 0-100. One group is 0.
  example: |
    reason_pct_rank:
      op: percent_rank
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: PercentRank

gap_to_leader:
  role: addon
  enabled: true
  aliases: []
  description: of minus the partition max. The leader is 0.
  example: |
    vs_best:
      op: gap_to_leader
      of: current_value
  module: kpi_engine.capabilities.ops.cut
  attr: GapToLeader

gap_to_avg:
  role: addon
  enabled: true
  aliases: []
  description: of minus the partition mean.
  example: |
    vs_typical:
      op: gap_to_avg
      of: current_value
  module: kpi_engine.capabilities.ops.cut
  attr: GapToAvg

zscore:
  role: addon
  enabled: true
  aliases: []
  description: (of - mean) / sample stdev on the partition. Zero stdev is 0.
  example: |
    reason_z:
      op: zscore
      of: current_value
  module: kpi_engine.capabilities.ops.cut
  attr: ZScore

running_avg:
  role: addon
  enabled: true
  aliases: []
  description: Ordered running mean of of on the cut.
  example: |
    running_mean:
      op: running_avg
      of: current_value
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: RunningAvg

top_n:
  role: addon
  enabled: true
  aliases: []
  description: 1 if RANK() is <= n, else 0. Ties can produce more than n ones.
  example: |
    top_reason:
      op: top_n
      of: current_value
      n: 3
      order: desc
  module: kpi_engine.capabilities.ops.cut
  attr: TopN

diff:
  role: platform
  enabled: true
  aliases: []
  description: of minus the same measure over the selection shifted by offset. Source is a base or shiftable measure.
  example: |
    vs_last_year:
      op: diff
      of: current_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: Diff

pct_change:
  role: platform
  enabled: true
  aliases: []
  description: growth_pct(of, lagged of) over the selection vs the shifted selection. Source is a base or shiftable measure. Same scale as fn growth_pct.
  example: |
    yoy:
      op: pct_change
      of: current_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: PctChange

compare:
  role: platform
  enabled: true
  aliases: []
  description: >
    Bind-time sugar; expands to pct_change or diff. Not evaluated.
    Period comparison presets (yoy, mom, wow, qoq, pop, diff, pct_change).
  example: |
    yoy:
      op: compare
      of: sotif_value
      mode: yoy
  module: kpi_engine.capabilities.ops.period
  attr: Compare

filtered_point:
  role: platform
  enabled: true
  aliases: []
  description: >
    Bind-time sugar; expands to point of a masked base. Not evaluated.
    Conditional sum/count at the selected period (column: or of: a base).
  example: |
    closed_amount:
      op: filtered_point
      column: amount
      agg: sum
      where: { column: status, op: eq, value: closed }
  module: kpi_engine.capabilities.ops.combo
  attr: FilteredPoint

filtered_window:
  role: platform
  enabled: true
  aliases: []
  description: >
    Bind-time sugar; expands to window of a masked base. Not evaluated.
    Trailing or period-to-date aggregate of a filtered fact.
  example: |
    closed_3m:
      op: filtered_window
      column: amount
      agg: sum
      where: { column: status, op: eq, value: closed }
      trailing: { months: 3 }
      inclusive: true
  module: kpi_engine.capabilities.ops.combo
  attr: FilteredWindow

filtered_trend:
  role: platform
  enabled: true
  aliases: []
  description: >
    Bind-time sugar; expands to trend of a masked base. Not evaluated.
    Sparkline of a filtered fact.
  example: |
    closed_trend_12m:
      op: filtered_trend
      column: amount
      agg: sum
      where: { column: status, op: eq, value: closed }
      trailing: { months: 12 }
      inclusive: true
      cuts: [G]
  module: kpi_engine.capabilities.ops.combo
  attr: FilteredTrend

filtered_compare:
  role: platform
  enabled: true
  aliases: []
  description: >
    Bind-time sugar; expands to compare then pct_change/diff of a masked base.
    Not evaluated. Filtered fact plus a compare preset in one measure key.
  example: |
    closed_yoy:
      op: filtered_compare
      column: amount
      agg: sum
      where: { column: status, op: eq, value: closed }
      mode: yoy
  module: kpi_engine.capabilities.ops.combo
  attr: FilteredCompare

expanding_window:
  role: addon
  enabled: true
  aliases: []
  description: Aggregate from span start (or year start) through the anchor.
  example: |
    ytd_expanding:
      op: expanding_window
      of: sotif_value
  module: kpi_engine.capabilities.ops.combo
  attr: ExpandingWindow

shifted_trend:
  role: addon
  enabled: true
  aliases: []
  description: Trend series shifted by offset.
  example: |
    trend_ly:
      op: shifted_trend
      of: sotif_value
      trailing: { months: 12 }
      offset: { years: 1 }
      cuts: [G]
  module: kpi_engine.capabilities.ops.combo
  attr: ShiftedTrend

rate:
  role: addon
  enabled: true
  aliases: []
  description: of / vs, or of / n.
  example: |
    per_period:
      op: rate
      of: sotif_value
      n: 3
  module: kpi_engine.capabilities.ops.combo
  attr: Rate

cumulative_point:
  role: addon
  enabled: true
  aliases: []
  description: Period-to-date (cumulative) aggregate of a base at the anchor.
  example: |
    ytd:
      op: cumulative_point
      of: sotif_value
  module: kpi_engine.capabilities.ops.combo
  attr: CumulativePoint

n_period_avg:
  role: addon
  enabled: true
  aliases: []
  description: Mean of per-period values over trailing N.
  example: |
    avg_3m:
      op: n_period_avg
      of: sotif_value
      trailing: { months: 3 }
  module: kpi_engine.capabilities.ops.combo
  attr: NPeriodAvg

weighted_window:
  role: addon
  enabled: true
  aliases: []
  description: Trailing window weighted by another base measure.
  example: |
    wavg_3m:
      op: weighted_window
      of: sotif_value
      weight: sotif_value
      trailing: { months: 3 }
  module: kpi_engine.capabilities.ops.combo
  attr: WeightedWindow

snapshot_compare:
  role: addon
  enabled: true
  aliases: []
  description: Compare two current scalars (pct or diff) without an offset.
  example: |
    vs_target:
      op: snapshot_compare
      of: current_value
      vs: value_3m
      mode: pct
  module: kpi_engine.capabilities.ops.combo
  attr: SnapshotCompare

bottom_n:
  role: addon
  enabled: true
  aliases: []
  description: 1 if the group is in the bottom n of of on the cut.
  example: |
    worst:
      op: bottom_n
      of: current_value
      n: 1
      cuts: [G]
  module: kpi_engine.capabilities.ops.cut
  attr: BottomN

rank_pct_change:
  role: addon
  enabled: true
  aliases: []
  description: Rank groups by period percent change of of.
  example: |
    movers:
      op: rank_pct_change
      of: current_value
      offset: { years: 1 }
      cuts: [G]
  module: kpi_engine.capabilities.ops.cut
  attr: RankPctChange

concentration:
  role: addon
  enabled: true
  aliases: []
  description: Herfindahl-Hirschman index of of shares on the cut.
  example: |
    hhi:
      op: concentration
      of: current_value
      cuts: [G]
  module: kpi_engine.capabilities.ops.cut
  attr: Concentration

abc_class:
  role: addon
  enabled: true
  aliases: []
  description: String A/B/C class from cumulative share (default 80/95).
  example: |
    cls:
      op: abc_class
      of: current_value
      cuts: [G]
  module: kpi_engine.capabilities.ops.cut
  attr: AbcClass

pareto_flag:
  role: addon
  enabled: true
  aliases: []
  description: 1 if the group is inside the leading cumulative-share band.
  example: |
    top80:
      op: pareto_flag
      of: current_value
      share: 80
      cuts: [G]
  module: kpi_engine.capabilities.ops.cut
  attr: ParetoFlag

normalize:
  role: addon
  enabled: true
  aliases: []
  description: of / max(of) or of / sum(of) on the cut.
  example: |
    scaled:
      op: normalize
      of: current_value
      method: max
      cuts: [G]
  module: kpi_engine.capabilities.ops.cut
  attr: Normalize

annualize:
  role: addon
  enabled: true
  aliases: []
  description: Scale of to a year using periods_per_year / n.
  example: |
    annual:
      op: annualize
      of: current_value
      n: 1
  module: kpi_engine.capabilities.ops.period
  attr: Annualize

vs_prior_window:
  role: addon
  enabled: true
  aliases: []
  description: Trailing window vs the same window shifted by offset.
  example: |
    win_yoy:
      op: vs_prior_window
      of: sotif_value
      trailing: { months: 3 }
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: VsPriorWindow

delta_contribution:
  role: addon
  enabled: true
  aliases: []
  description: Current minus lagged of (or minus vs).
  example: |
    delta:
      op: delta_contribution
      of: current_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: DeltaContribution

baseline_index:
  role: addon
  enabled: true
  aliases: []
  description: of / vs × 100. vs may be a measure or lagged of.
  example: |
    idx:
      op: baseline_index
      of: current_value
      offset: { years: 1 }
  module: kpi_engine.capabilities.ops.period
  attr: BaselineIndex

band:
  role: addon
  enabled: true
  aliases: []
  description: >
    Factor or offset band around of. Bind expands to {key}_low and {key}_high
    unless emit: names a single side.
  example: |
    value_band:
      op: band
      of: current_value
      method: factor
      low: 0.8
      high: 1.2
  module: kpi_engine.capabilities.ops.combo
  attr: Band

envelope:
  role: addon
  enabled: true
  aliases: []
  description: Alias of band — dual keys {key}_low / {key}_high.
  example: |
    value_env:
      op: envelope
      of: current_value
      low: 0.9
      high: 1.1
  module: kpi_engine.capabilities.ops.combo
  attr: Envelope

compound_growth:
  role: addon
  enabled: true
  aliases: []
  description: >
    (end/start)^(1/n) − 1 over a fixed N periods. Use hook:cagr for a trailing
    observed series (mutually exclusive shapes — pick one).
  example: |
    growth_12:
      op: compound_growth
      of: sotif_value
      n: 12
  module: kpi_engine.capabilities.ops.period
  attr: CompoundGrowth

seasonal_adjust:
  role: addon
  enabled: true
  aliases: []
  description: Deseasonalize current × overall mean / same-month mean in the trailing window.
  example: |
    adj:
      op: seasonal_adjust
      of: sotif_value
      trailing: { months: 36 }
  module: kpi_engine.capabilities.ops.period
  attr: SeasonalAdjust
