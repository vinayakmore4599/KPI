kpi_id: 3004
version: 1
model: sotif

time:
  column: event_month
  grain: month
  filter_code: reporting_month
  calendar: gregorian
  timezone: UTC

dimensions:
  - { name: reason_code, kind: dimension }
  - { name: region, kind: dimension }

base_measures:
  sotif_value:
    sql: amount
    agg: sum

cuts:
  - name: G
    group_by: [reason_code]
    ignore_filters: [region]
    also_emit: [R]
  - name: R
    group_by: [reason_code, region]
    ignore_filters: []

default_cut: G
row_set: span_union

outputs:
  reason_code:
    kind: dimension

  current_value:
    of: sotif_value
    op: point
    offset: { months: 0 }

  previous_year_value:
    of: sotif_value
    op: point
    offset: { years: 1 }

  value_3m:
    of: sotif_value
    op: window
    trailing: { months: 3 }
    inclusive: true

  value_6m:
    of: sotif_value
    op: window
    trailing: { months: 6 }
    inclusive: true

  value_12m:
    of: sotif_value
    op: window
    trailing: { months: 12 }
    inclusive: true

  yoy_month:
    op: arithmetic
    fn: growth_pct
    left: current_value
    right: previous_year_value

  trend_12m:
    of: sotif_value
    op: trend
    trailing: { months: 12 }
    inclusive: true
    cuts: [G]
