seasonal_index:
  role: addon
  enabled: true
  aliases: []
  description: Anchor vs the average of the same calendar month in prior years.
  example: |
    seasonal:
      op: hook
      hook: seasonal_index
      of: sotif_value
      trailing: { months: 36 }
  module: kpi_engine.capabilities.hooks.impl
  attr: seasonal_index

ewma:
  role: addon
  enabled: true
  aliases: []
  description: Recency-weighted average of period values. Alpha = 2 / (N + 1).
  example: |
    smoothed:
      op: hook
      hook: ewma
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: ewma

period_max:
  role: addon
  enabled: true
  aliases: []
  description: Largest period value in the trailing window.
  example: |
    best_month:
      op: hook
      hook: period_max
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_max

period_min:
  role: addon
  enabled: true
  aliases: []
  description: Smallest period value in the trailing window.
  example: |
    worst_month:
      op: hook
      hook: period_min
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_min

period_median:
  role: addon
  enabled: true
  aliases: [rolling_median]
  description: Median of period values in the trailing window.
  example: |
    typical_month:
      op: hook
      hook: period_median
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_median

period_avg:
  role: addon
  enabled: true
  aliases: []
  description: Mean of period values in the trailing window.
  example: |
    typical_level:
      op: hook
      hook: period_avg
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_avg

period_sum:
  role: addon
  enabled: true
  aliases: []
  description: Sum of period values in the trailing window.
  example: |
    window_total:
      op: hook
      hook: period_sum
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_sum

hit_rate:
  role: addon
  enabled: true
  aliases: []
  requires_value: true
  description: Percent of observed periods whose value is >= value.
  example: |
    months_on_sla:
      op: hook
      hook: hit_rate
      of: sotif_value
      trailing: { months: 12 }
      value: 95
  module: kpi_engine.capabilities.hooks.impl
  attr: hit_rate

streak:
  role: addon
  enabled: true
  aliases: []
  requires_value: true
  description: Consecutive periods ending at the anchor whose value is >= value.
  example: |
    sla_streak:
      op: hook
      hook: streak
      of: sotif_value
      trailing: { months: 12 }
      value: 95
  module: kpi_engine.capabilities.hooks.impl
  attr: streak

period_stdev:
  role: addon
  enabled: true
  aliases: []
  description: Sample standard deviation of period values in the trailing window.
  example: |
    volatility:
      op: hook
      hook: period_stdev
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_stdev

period_var:
  role: addon
  enabled: true
  aliases: []
  description: Sample variance of period values in the trailing window.
  example: |
    variance:
      op: hook
      hook: period_var
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_var

period_cv:
  role: addon
  enabled: true
  aliases: []
  description: Sample stdev / mean × 100 of period values in the trailing window.
  example: |
    relative_vol:
      op: hook
      hook: period_cv
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_cv

period_range:
  role: addon
  enabled: true
  aliases: []
  description: Largest minus smallest period value in the trailing window.
  example: |
    spread:
      op: hook
      hook: period_range
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_range

period_count:
  role: addon
  enabled: true
  aliases: []
  description: Count of observed periods in the trailing window.
  example: |
    months_seen:
      op: hook
      hook: period_count
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: period_count

miss_rate:
  role: addon
  enabled: true
  aliases: []
  requires_value: true
  description: Percent of observed periods whose value is below value.
  example: |
    months_off_sla:
      op: hook
      hook: miss_rate
      of: sotif_value
      trailing: { months: 12 }
      value: 95
  module: kpi_engine.capabilities.hooks.impl
  attr: miss_rate

miss_streak:
  role: addon
  enabled: true
  aliases: []
  requires_value: true
  description: Consecutive periods ending at the anchor whose value is below value.
  example: |
    off_sla_run:
      op: hook
      hook: miss_streak
      of: sotif_value
      trailing: { months: 12 }
      value: 95
  module: kpi_engine.capabilities.hooks.impl
  attr: miss_streak

longest_streak:
  role: addon
  enabled: true
  aliases: []
  requires_value: true
  description: Longest run of periods >= value anywhere in the trailing window.
  example: |
    best_run:
      op: hook
      hook: longest_streak
      of: sotif_value
      trailing: { months: 12 }
      value: 95
  module: kpi_engine.capabilities.hooks.impl
  attr: longest_streak

cagr:
  role: addon
  enabled: true
  aliases: []
  description: Compound annual growth from first to last observed value (growth_pct scale).
  example: |
    annualized:
      op: hook
      hook: cagr
      of: sotif_value
      trailing: { months: 36 }
  module: kpi_engine.capabilities.hooks.impl
  attr: cagr

slope:
  role: addon
  enabled: true
  aliases: []
  description: Least-squares slope of value vs observed period index (0..n-1).
  example: |
    trend_slope:
      op: hook
      hook: slope
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: slope

mad:
  role: addon
  enabled: true
  aliases: []
  description: Median absolute deviation of period values in the trailing window.
  example: |
    robust_spread:
      op: hook
      hook: mad
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: mad

projection:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [periods_ahead]
  description: Linear forecast — last observed value plus slope times periods_ahead (default 1).
  example: |
    next_month:
      op: hook
      hook: projection
      of: sotif_value
      trailing: { months: 12 }
      periods_ahead: 1
  module: kpi_engine.capabilities.hooks.impl
  attr: projection

autocorrelation:
  role: addon
  enabled: true
  aliases: []
  description: Lag-1 Pearson correlation of consecutive observed period values.
  example: |
    ac1:
      op: hook
      hook: autocorrelation
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: autocorrelation

rsi:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [n]
  description: Wilder RSI of period-to-period changes.
  example: |
    rsi14:
      op: hook
      hook: rsi
      of: sotif_value
      trailing: { months: 14 }
  module: kpi_engine.capabilities.hooks.impl
  attr: rsi

bollinger:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [k]
  description: "%b of the last value in a k-sigma band around the window mean (k default 2)."
  example: |
    bb:
      op: hook
      hook: bollinger
      of: sotif_value
      trailing: { months: 12 }
      k: 2
  module: kpi_engine.capabilities.hooks.impl
  attr: bollinger

exponential_decay_sum:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [decay]
  description: Sum v_i × decay^(age). decay default 0.5.
  example: |
    decayed:
      op: hook
      hook: exponential_decay_sum
      of: sotif_value
      trailing: { months: 12 }
      decay: 0.5
  module: kpi_engine.capabilities.hooks.impl
  attr: exponential_decay_sum

theil_sen_slope:
  role: addon
  enabled: true
  aliases: []
  description: Median of pairwise slopes of value vs observed period index.
  example: |
    robust_slope:
      op: hook
      hook: theil_sen_slope
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: theil_sen_slope

changepoint:
  role: addon
  enabled: true
  aliases: []
  description: 1-based index of the mean-shift split in the trailing window.
  example: |
    shift:
      op: hook
      hook: changepoint
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: changepoint

outlier_count:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [k]
  description: Count of observed values with |z| > k (default 3).
  example: |
    outliers:
      op: hook
      hook: outlier_count
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: outlier_count

percentile_rank_series:
  role: addon
  enabled: true
  aliases: []
  description: Percentile rank (0–100) of the last observed value in the window.
  example: |
    pr:
      op: hook
      hook: percentile_rank_series
      of: sotif_value
      trailing: { months: 12 }
  module: kpi_engine.capabilities.hooks.impl
  attr: percentile_rank_series

weighted_ewma:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [alpha]
  description: EWMA with explicit alpha (default 2/(N+1)).
  example: |
    smooth:
      op: hook
      hook: weighted_ewma
      of: sotif_value
      trailing: { months: 12 }
      alpha: 0.3
  module: kpi_engine.capabilities.hooks.impl
  attr: weighted_ewma

run_rate:
  role: addon
  enabled: true
  aliases: []
  description: Last observed value annualized by the KPI grain.
  example: |
    annualized:
      op: hook
      hook: run_rate
      of: sotif_value
      trailing: { months: 3 }
  module: kpi_engine.capabilities.hooks.impl
  attr: run_rate

target_trajectory:
  role: addon
  enabled: true
  aliases: []
  description: "Last / linear path from first observed to value: target."
  example: |
    pace:
      op: hook
      hook: target_trajectory
      of: sotif_value
      trailing: { months: 12 }
      value: 100
  module: kpi_engine.capabilities.hooks.impl
  attr: target_trajectory

forecast_confidence:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [k, side, emit, periods_ahead]
  description: >
    Linear projection ± k × stdev. Bind expands to {key}_low / {key}_high
    unless emit: names one side.
  example: |
    fc:
      op: hook
      hook: forecast_confidence
      of: sotif_value
      trailing: { months: 12 }
      k: 1.96
  module: kpi_engine.capabilities.hooks.impl
  attr: forecast_confidence

seasonal_decompose:
  role: addon
  enabled: true
  aliases: []
  description: Seasonal factor at the anchor month (same-month mean / overall mean).
  example: |
    seas:
      op: hook
      hook: seasonal_decompose
      of: sotif_value
      trailing: { months: 36 }
  module: kpi_engine.capabilities.hooks.impl
  attr: seasonal_decompose

cohort_retention:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [cohort_column, entry_period]
  description: Share of entities first seen at entry_period that are still present at the anchor.
  example: |
    retain:
      op: hook
      hook: cohort_retention
      of: sotif_value
      trailing: { months: 12 }
      cohort_column: supplier_name
      entry_period: "2025-01-01"
  module: kpi_engine.capabilities.hooks.impl
  attr: cohort_retention

survival_rate:
  role: addon
  enabled: true
  aliases: []
  extra_keys: [cohort_column, entry_period]
  description: Share of entities that entered on or before entry_period still present at the anchor.
  example: |
    survive:
      op: hook
      hook: survival_rate
      of: sotif_value
      trailing: { months: 12 }
      cohort_column: supplier_name
      entry_period: "2025-01-01"
  module: kpi_engine.capabilities.hooks.impl
  attr: survival_rate
